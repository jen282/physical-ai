le class="dot-edge" cx="64.0" cy="338.9" r="4"/><circle class="dot-edge" cx="168.0" cy="336.7" r="4"/><circle class="dot-edge" cx="272.0" cy="334.5" r="4"/><circle class="dot-edge" cx="376.0" cy="332.4" r="4"/><circle class="dot-edge" cx="480.0" cy="330.2" r="4"/><circle class="dot-edge" cx="584.0" cy="328.0" r="4"/><line class="lead" x1="96.0" y1="331.2" x2="96.0" y2="258.2"/><circle class="mark" cx="96.0" cy="338.2" r="5"/><text class="val" x="90.0" y="236.4">손익분기점 약 3.7개월</text><text class="note" x="90.0" y="250.5">이후로는 엣지가 계속 저렴</text><text class="val" x="596.0" y="132.9">클라우드 20.5억</text><text class="val" x="596.0" y="332.5">엣지 2.2억</text><path class="lead" d="M602.0,142.4 H606.0 V314.0 H602.0"/><text class="val" x="616.0" y="224.2">차이 18.3억</text><text class="note" x="616.0" y="242.2">약 9.3배</text></g></svg>
