<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="연간 비용 구조: 엣지는 초기 1.2억 원과 매년 유지보수 0.2억 원, 클라우드는 초기 비용 없이 매년 4.1억 원(GPU 서버 2.4, 회선 1.2, 저장 0.5)">
<style>
  .root { --surface:#fcfcfb; --border:rgba(11,11,11,0.10); --ink:#0b0b0b; --ink2:#52514e;
          --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7; --edge:#2a78d6; --cloud:#eb6834; }
  @media (prefers-color-scheme: dark) {
    .root { --surface:#1a1a19; --border:rgba(255,255,255,0.10); --ink:#ffffff; --ink2:#c3c2b7;
            --muted:#898781; --grid:#2c2c2a; --axis:#383835; --edge:#3987e5; --cloud:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  .bg { fill:var(--surface); stroke:var(--border); }
  .title { font-size:16px; font-weight:600; fill:var(--ink); }
  .sub { font-size:12px; fill:var(--ink2); }
  .group { font-size:13px; font-weight:600; fill:var(--ink2); }
  .row { font-size:13px; fill:var(--ink); }
  .val { font-size:13px; font-weight:600; fill:var(--ink); }
  .note { font-size:12px; fill:var(--ink2); }
  .tick { font-size:11px; fill:var(--muted); font-variant-numeric:tabular-nums; }
  .inbar { font-size:12px; font-weight:500; fill:#0b0b0b; }
  .grid { stroke:var(--grid); stroke-width:1; }
  .axis { stroke:var(--axis); stroke-width:1; }
  .lead { stroke:var(--muted); stroke-width:1; fill:none; }
  .edge { fill:var(--edge); } .cloud { fill:var(--cloud); }
  .edge-line { stroke:var(--edge); } .cloud-line { stroke:var(--cloud); }
  .line { stroke-width:2; fill:none; stroke-linejoin:round; stroke-linecap:round; }
  .dot-edge { fill:var(--edge); stroke:var(--surface); stroke-width:2; }
  .dot-cloud { fill:var(--cloud); stroke:var(--surface); stroke-width:2; }
  .mark { fill:var(--surface); stroke:var(--ink); stroke-width:1.5; }
</style>
