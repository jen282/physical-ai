<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>피지컬 AI 부품 도감</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 헤더 + 탭 5개, 한 번에 패널 하나. 기판 실크스크린 느낌 — 얇은 선, 모노 라벨, MCU=구리 / SBC=파랑 2색 코드 */
:root{
  --bg:#f1f4f0; --surface:#ffffff; --ink:#18211c; --muted:#5f6d65; --line:#d3dbd5;
  --mcu:#b5601a; --mcu-soft:#f6e7da; --sbc:#2b5ea6; --sbc-soft:#dfe8f6;
  --ok:#2b8449; --ok-soft:#ddf1e4; --warn:#a87a0c; --warn-soft:#f8efd5; --bad:#c03838; --bad-soft:#f9e0e0;
  --dot:rgba(24,33,28,.07);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#161f1a; --ink:#e3eae5; --muted:#93a39a; --line:#2b3732;
  --mcu:#e38d47; --mcu-soft:#382617; --sbc:#7ba5e8; --sbc-soft:#1b2940;
  --ok:#5fc380; --ok-soft:#163020; --warn:#e0b44a; --warn-soft:#352c12; --bad:#f07272; --bad-soft:#3c1c1c;
  --dot:rgba(227,234,229,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#161f1a; --ink:#e3eae5; --muted:#93a39a; --line:#2b3732;
  --mcu:#e38d47; --mcu-soft:#382617; --sbc:#7ba5e8; --sbc-soft:#1b2940;
  --ok:#5fc380; --ok-soft:#163020; --warn:#e0b44a; --warn-soft:#352c12; --bad:#f07272; --bad-soft:#3c1c1c;
  --dot:rgba(227,234,229,.06); color-scheme:dark}

[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:18px 18px}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sbc);outline-offset:2px}
.mono{font-family:var(--f-mono)}

/* header */
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h1{font-size:clamp(26px,4.2vw,40px);line-height:1.15;margin:6px 0 14px;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
.legend{display:flex;flex-wrap:wrap;gap:10px}
.lg{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.lg i{width:12px;height:12px;border-radius:3px;display:block}
.lg.mcu i{background:var(--mcu)} .lg.sbc i{background:var(--sbc)}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:26px 0 18px;border-bottom:1px solid var(--line);padding-bottom:12px}
.tab{background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 14px;color:var(--muted);font-weight:500}
.tab b{font-family:var(--f-mono);font-size:12px;margin-right:6px;opacity:.7}
.tab:hover{color:var(--ink);border-color:var(--line)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.panel h2{font-size:21px;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px}

.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.controls .lbl{font-size:13px;color:var(--muted)}

/* 1. scale bars */
.bars{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:8px}
.brow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center}
.brow .nm{font-family:var(--f-mono);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{display:flex;align-items:center;gap:8px;min-width:0}
.bar{height:18px;border-radius:4px;transition:width .7s cubic-bezier(.2,.7,.2,1);min-width:4px}
.bar.mcu{background:var(--mcu)} .bar.sbc{background:var(--sbc)}
.val{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.gap{display:flex;align-items:center;gap:10px;margin:6px 0;color:var(--ink)}
.gap::before,.gap::after{content:"";flex:1;border-top:1px dashed var(--line)}
.gap span{font-family:var(--f-mono);font-size:13px;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.gap strong{font-size:16px}
.takeaway{margin-top:14px;font-size:15px;padding:12px 14px;border-left:3px solid var(--ink);background:var(--surface);border-radius:0 8px 8px 0}

/* 2. cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.card:hover{border-color:var(--muted)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kind{font-family:var(--f-mono);font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.04em}
.kind.mcu{background:var(--mcu-soft);color:var(--mcu)} .kind.sbc{background:var(--sbc-soft);color:var(--sbc)}
.tag{font-size:12px;color:var(--muted)}
.card .nm{font-weight:700;font-size:17px;line-height:1.25}
.card .chip{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:2px}
.meters{display:grid;gap:4px}
.m{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:8px;font-size:12px;color:var(--muted);border-radius:4px;padding:1px 3px;margin:0 -3px}
.m.hl{background:var(--bg);color:var(--ink);font-weight:700}
.pips{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.pips i{height:7px;border-radius:2px;background:var(--line)}
.card.mcu .pips i.on,.sheet.mcu .pips i.on{background:var(--mcu)} .card.sbc .pips i.on,.sheet.sbc .pips i.on{background:var(--sbc)}
.flipHint{font-size:12px;color:var(--muted);font-family:var(--f-mono)}

/* detail sheet */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,14,12,.55);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);color:var(--ink);border-radius:16px;width:min(760px,100%);max-height:100%;overflow:auto;padding:22px;display:grid;gap:18px;border-top:6px solid var(--line)}
.sheet.mcu{border-top-color:var(--mcu)} .sheet.sbc{border-top-color:var(--sbc)}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-top .nm{font-size:26px;font-weight:700;line-height:1.2;margin-top:6px}
.sh-top .chip{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.sh-nav{display:flex;gap:6px;flex:none}
.icon{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:16px;display:grid;place-items:center}
.icon:hover{border-color:var(--ink)}
.sh-meters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sh-meters .m{grid-template-columns:1fr;gap:4px;margin:0;padding:0;font-size:12px}
.pc-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.pc-col h3{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.pc-col.pro h3{color:var(--ok)} .pc-col.con h3{color:var(--bad)}
.pt{border-radius:10px;padding:10px 12px;margin-bottom:8px}
.pc-col.pro .pt{background:var(--ok-soft)} .pc-col.con .pt{background:var(--bad-soft)}
.pt b{display:block;font-size:15px;margin-bottom:2px}
.pt span{font-size:14px;line-height:1.5}
.use{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.use .ul{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-right:4px}
.use .u{padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.use .u.y{border-color:var(--ok);color:var(--ok)} .use .u.n{border-color:var(--bad);color:var(--bad)}

/* 3. requirement tuner */
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.preset{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.preset:hover{border-color:var(--ink)}
.preset[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tuner{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
.knobs{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.knob .kl{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin-bottom:6px}
.knob .kv{font-family:var(--f-mono);font-size:12px;color:var(--sbc);font-weight:700}
.knob input[type=range]{width:100%;accent-color:var(--ink)}
.knob .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.radios{display:flex;flex-wrap:wrap;gap:4px}
.radios button{border:1px solid var(--line);background:transparent;border-radius:7px;padding:5px 10px;font-size:13px}
.radios button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rank{display:grid;gap:6px}
.rk{display:grid;grid-template-columns:22px minmax(0,150px) minmax(0,1fr);gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.rk .no{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.rk .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;min-width:0}
.rk .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .nm i{width:8px;height:8px;border-radius:2px;flex:none}
.rk.mcu .nm i{background:var(--mcu)} .rk.sbc .nm i{background:var(--sbc)}
.rk .fit{display:flex;align-items:center;gap:8px;min-width:0}
.rk .fbar{height:10px;border-radius:3px;background:var(--line);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.rk.mcu .fbar{background:var(--mcu)} .rk.sbc .fbar{background:var(--sbc)}
.rk .why{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rk.top{border-width:2px;border-color:var(--ink)}
.rk.low{opacity:.45}
.verdictBox{margin-bottom:10px;padding:12px 14px;border-radius:10px;font-size:14px;background:var(--surface);border:1px solid var(--line)}
.verdictBox b{font-size:16px}
.verdictBox.hard{border-color:var(--warn);background:var(--warn-soft)}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:9px;padding:8px 16px;font-weight:700}
.btn.ghostbtn{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* 4. tree */
.tree{display:grid;gap:14px}
.trail{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:32px}
.crumb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.crumb b{color:var(--sbc)}
.crumb:hover{border-color:var(--ink)}
.arrow{color:var(--muted);font-family:var(--f-mono)}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px}
.qbox .q{font-size:clamp(20px,3vw,26px);font-weight:700;text-wrap:balance}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{border:1.5px solid var(--ink);background:transparent;border-radius:10px;padding:12px 22px;font-size:16px;font-weight:700;min-width:96px}
.opt:hover{background:var(--ink);color:var(--bg)}
.result{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.res{border-radius:12px;padding:16px;border:1.5px solid var(--line);background:var(--surface);display:grid;gap:4px}
.res.mcu{border-color:var(--mcu)} .res.sbc{border-color:var(--sbc)}
.res .nm{font-size:19px;font-weight:700}
.res .sp{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.foot{margin-top:40px;font-size:12px;color:var(--muted);font-family:var(--f-mono)}

@media (max-width:720px){
  .pc-cols{grid-template-columns:minmax(0,1fr)}
  .sh-meters{grid-template-columns:repeat(3,minmax(0,1fr))}
  .modal{place-items:end center}
  .tuner{grid-template-columns:minmax(0,1fr)}
  .knobs{position:static}
  .rk{grid-template-columns:20px minmax(0,1fr)}
  .rk .fit{grid-column:2}
  .brow{grid-template-columns:104px minmax(0,1fr);gap:8px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">8_5 · 상황별 부품 선택</div>
    <h1>피지컬 AI 부품 도감</h1>
    <div class="legend">
      <span class="lg mcu"><i></i>MCU · 반사신경</span>
      <span class="lg sbc"><i></i>SBC · 두뇌</span>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="단계">
    <button class="tab" role="tab" data-tab="scale" aria-selected="true"><b>1</b>체급 비교</button>
    <button class="tab" role="tab" data-tab="cards" aria-selected="false"><b>2</b>부품 도감</button>
    <button class="tab" role="tab" data-tab="match" aria-selected="false"><b>3</b>조건 조절기</button>
    <button class="tab" role="tab" data-tab="tree" aria-selected="false"><b>4</b>질문으로 고르기</button>
  </nav>

  <main>
    <!-- 1 -->
    <section class="panel" id="p-scale">
      <h2>MCU와 SBC, 체급이 얼마나 다를까?</h2>
      <p class="lead">기준을 바꿔 보세요. 막대는 로그 스케일입니다.</p>
      <div class="controls">
        <div class="seg" id="metricSeg">
          <button data-m="ram" aria-pressed="true">메모리(RAM)</button>
          <button data-m="pw" aria-pressed="false">소비전력</button>
          <button data-m="boot" aria-pressed="false">부팅 시간</button>
        </div>
      </div>
      <div class="bars" id="bars"></div>
      <div class="takeaway" id="takeaway"></div>
    </section>

    <!-- 2 -->
    <section class="panel" id="p-cards" hidden>
      <h2>부품마다 특색이 있다</h2>
      <p class="lead">정렬 기준을 눌러 1등을 찾고, 카드를 눌러 장단점과 그 이유를 확인하세요.</p>
      <div class="controls">
        <div class="seg" id="kindSeg">
          <button data-k="all" aria-pressed="true">전체</button>
          <button data-k="mcu" aria-pressed="false">MCU</button>
          <button data-k="sbc" aria-pressed="false">SBC</button>
        </div>
        <span class="lbl">정렬</span>
        <div class="seg" id="sortSeg">
          <button data-s="-1" aria-pressed="true">기본</button>
          <button data-s="0" aria-pressed="false">저전력</button>
          <button data-s="1" aria-pressed="false">성능</button>
          <button data-s="2" aria-pressed="false">무선</button>
          <button data-s="3" aria-pressed="false">실시간</button>
          <button data-s="4" aria-pressed="false">자료·생태계</button>
        </div>
      </div>
      <div class="cards" id="cards"></div>
    </section>

    <!-- 3 -->
    <section class="panel" id="p-match" hidden>
      <h2>조건이 바뀌면 1등이 바뀐다</h2>
      <p class="lead">예시 상황을 누르거나 조건을 직접 움직여 보세요.</p>
      <div class="presets" id="presets"></div>
      <div class="tuner">
        <div class="knobs" id="knobs"></div>
        <div>
          <div class="verdictBox" id="verdict"></div>
          <div class="rank" id="rank"></div>
        </div>
      </div>
    </section>

    <!-- 4 -->
    <section class="panel" id="p-tree" hidden>
      <h2>질문에 답하면 부품이 나온다</h2>
      <p class="lead">지나온 답을 누르면 그 질문으로 돌아갑니다.</p>
      <div class="tree" id="tree"></div>
    </section>

  </main>

  <div class="modal" id="modal" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shName"></div>
  </div>

  <div class="foot">수치는 대표값입니다. 같은 이름이라도 모델·설정에 따라 다릅니다.</div>
</div>

<script>
(function(){
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s,r=document)=>r.querySelector(s);
const el = (tag,cls,html)=>{const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e;};

/* ---------- data ---------- */
const AX=["저전력","성능","무선","실시간","자료"];
const P=[
 {id:"uno",k:"mcu",n:"Arduino Uno",c:"ATmega328P",t:"입문·교육",sp:"8bit · 16MHz · RAM 2KB",s:[3,1,0,4,5],y:["버튼·LED·릴레이","교육용 키트"],x:["무선 통신","MQTT·JSON 처리"]},
 {id:"stm32",k:"mcu",n:"STM32",c:"ARM Cortex-M",t:"산업·모터 제어",sp:"M0~M7·M55 · 기본형 무선 없음",s:[4,3,1,5,4],y:["모터 정밀 제어","드론 비행 제어","CAN 통신"],x:["빠른 Wi-Fi 시제품"]},
 {id:"pico",k:"mcu",n:"Raspberry Pi Pico",c:"RP2040 / RP2350",t:"정밀 타이밍 (PIO)",sp:"듀얼코어 · RAM 264~520KB",s:[2,2,2,5,4],y:["LED 스트립","특수 신호 생성","MicroPython 입문"],x:["배터리 장기 동작"]},

/* ---------- tabs ---------- */
const tabs=[...document.querySelectorAll('.tab')];
function showTab(name){
  tabs.forEach(t=>t.setAttribute('aria-selected',String(t.dataset.tab===name)));
  document.querySelectorAll('.panel').forEach(p=>p.hidden = p.id!=='p-'+name);
  try{history.replaceState(null,'','#'+name)}catch(e){}
}
tabs.forEach(t=>t.addEventListener('click',()=>showTab(t.dataset.tab)));
const h=(location.hash||'').slice(1);
if(tabs.some(t=>t.dataset.tab===h)) showTab(h);

function segInit(seg,attr,cb){
  seg.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    cb(b.dataset[attr]);
  });
}

const MET={
 ram:{fmt:v=>v>=1e9?(v/1e9)+"GB":v>=1e6?(v/1e6)+"MB":(v/1e3)+"KB",lo:1e3,hi:16e9,
      tk:"KB 대 GB. 리눅스·도커·AI는 GB가 필요합니다."},
 pw:{fmt:v=>v>=1?"약 "+v+"W":"약 "+Math.round(v*1000)+"mW",lo:.005,hi:30,
      tk:"배터리로 오래 버텨야 하면 MCU. Deep Sleep에선 µW까지 내려갑니다 (8_4 듀티 사이클)."},
 boot:{fmt:v=>v>=1?"약 "+v+"초":"약 "+Math.round(v*1000)+"ms",lo:.005,hi:60,
      tk:"MCU는 켜자마자 동작, SBC는 OS 부팅을 기다려야 합니다. 비상정지를 MCU에 맡기는 이유입니다."}
};
const bars=$('#bars');
function drawBars(m){
  const M=MET[m], L=Math.log10;
  const w=v=>Math.max(2,(L(v)-L(M.lo))/(L(M.hi)-L(M.lo))*100);
  if(!bars.children.length){
    SC.forEach((d,i)=>{
      if(i>0 && SC[i-1].k!==d.k){ const g=el('div','gap','<span id="ratio"></span>'); bars.appendChild(g); }
      const r=el('div','brow',`<div class="nm">${d.n}</div><div class="track"><span class="bar ${d.k}" style="width:0"></span><span class="val"></span></div>`);
      r.dataset.id=d.id; bars.appendChild(r);
    });
  }
  bars.querySelectorAll('.brow').forEach(r=>{
    const d=SC.find(x=>x.id===r.dataset.id);
    const bar=r.querySelector('.bar');
    // track width leaves room for the value label
    bar.style.width=`calc(${w(d[m])}% * 0.78)`;
    r.querySelector('.val').textContent=M.fmt(d[m]);
  });
  const mcu=SC.filter(d=>d.k==="mcu").map(d=>d[m]), sbc=SC.filter(d=>d.k==="sbc").map(d=>d[m]);
  const ratio=Math.min(...sbc)/Math.max(...mcu);
  const nice=ratio>=100?Math.round(ratio/100)*100:Math.round(ratio);
  $('#ratio').innerHTML=`MCU 최대 → SBC 최소 <strong>약 ${nice.toLocaleString('ko-KR')}배</strong>`;
  $('#takeaway').textContent=M.tk;
}
segInit($('#metricSeg'),'m',drawBars);
requestAnimationFrame(()=>drawBars('ram'));

 bbb:{p:[["PRU 실시간 코프로세서","리눅스가 바빠도 PRU가 독립적으로 µs 단위 신호를 정확히 처리합니다."],["풍부한 I/O","GPIO·ADC가 많아 산업 장비 제어에 유리합니다."]],
      c:[["오래된 CPU","1GHz 싱글코어라 AI나 무거운 작업은 어렵습니다."],["PRU 학습 비용","PRU용 프로그래밍을 따로 배워야 합니다."]]},
 latte:{p:[["x86 호환","Windows와 x86 전용 소프트웨어·드라이버가 그대로 동작합니다."],["PC급 성능","인텔 CPU라 일반 PC 작업을 그대로 할 수 있습니다."]],
      c:[["전력 · 발열","ARM SBC보다 전력이 크고 방열이 필요합니다."],["하드웨어 제어 자료 적음","GPIO 활용 자료가 Pi보다 적어 보조 MCU와 함께 쓰는 경우가 많습니다."]]}
};
const modal=$('#modal'), sheet=$('#sheet'); let curId=null, opener=null;
function visibleIds(){return [...cardsEl.children].filter(c=>!c.hidden).map(c=>c.dataset.id);}
function openSheet(id,from){
  curId=id; if(from) opener=from; const p=byId[id], d=D[id];
  sheet.className='sheet '+p.k;
  sheet.innerHTML=`<div class="sh-top"><div><span class="kind ${p.k}">${p.k.toUpperCase()}</span> <span class="tag">${p.t}</span>
      <div class="nm" id="shName">${p.n}</div><div class="chip">${p.c} · ${p.sp}</div></div>
    <div class="sh-nav"><button class="icon" data-a="prev" aria-label="이전 부품">←</button><button class="icon" data-a="next" aria-label="다음 부품">→</button><button class="icon" data-a="close" aria-label="닫기">✕</button></div></div>
   <div class="sh-meters">${meters(p)}</div>
   <div class="pc-cols">
     <div class="pc-col pro"><h3>✓ 장점</h3>${d.p.map(([t,w])=>`<div class="pt"><b>${t}</b><span>${w}</span></div>`).join('')}</div>
     <div class="pc-col con"><h3>✕ 단점</h3>${d.c.map(([t,w])=>`<div class="pt"><b>${t}</b><span>${w}</span></div>`).join('')}</div>
   </div>
   <div class="use"><span class="ul">이럴 때</span>${p.y.map(t=>`<span class="u y">${t}</span>`).join('')}</div>
   <div class="use"><span class="ul">피할 때</span>${p.x.map(t=>`<span class="u n">${t}</span>`).join('')}</div>`;
  if(sortKey>=0) sheet.querySelectorAll('.m').forEach(m=>m.classList.toggle('hl',Number(m.dataset.i)===sortKey));
  modal.hidden=false; sheet.scrollTop=0;
  sheet.querySelector('[data-a="close"]').focus({preventScroll:true});
}
function closeSheet(){modal.hidden=true; if(opener) opener.focus({preventScroll:true});}
function step(dir){const ids=visibleIds(), i=ids.indexOf(curId); const nid=ids[(i+dir+ids.length)%ids.length]; opener=cardsEl.querySelector(`[data-id="${nid}"]`); openSheet(nid);}
sheet.addEventListener('click',e=>{const b=e.target.closest('[data-a]'); if(!b) return; ({prev:()=>step(-1),next:()=>step(1),close:closeSheet})[b.dataset.a]();});
modal.addEventListener('click',e=>{if(e.target===modal) closeSheet();});
document.addEventListener('keydown',e=>{ if(modal.hidden) return;
  if(e.key==='Escape') closeSheet(); else if(e.key==='ArrowLeft') step(-1); else if(e.key==='ArrowRight') step(1); });
function flip(container,mutate){
  const kids=[...container.children], first=new Map(kids.map(k=>[k,k.getBoundingClientRect()]));
  mutate();
  if(reduce) return;
  kids.forEach(k=>{
    if(k.hidden) return; const f=first.get(k); if(!f.width) return;
    const l=k.getBoundingClientRect(), dx=f.left-l.left, dy=f.top-l.top;
    if(dx||dy) k.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:450,easing:'cubic-bezier(.2,.7,.2,1)'});
  });
}
function arrange(){
  flip(cardsEl,()=>{
    const list=[...cardsEl.children];
    const order=P.map(p=>p.id);
    list.sort((a,b)=>{
      if(sortKey<0) return order.indexOf(a.dataset.id)-order.indexOf(b.dataset.id);
      return byId[b.dataset.id].s[sortKey]-byId[a.dataset.id].s[sortKey] || order.indexOf(a.dataset.id)-order.indexOf(b.dataset.id);
    }).forEach(n=>cardsEl.appendChild(n));
    list.forEach(n=>{
      n.hidden = kind!=='all' && byId[n.dataset.id].k!==kind;
      n.querySelectorAll('.m').forEach(m=>m.classList.toggle('hl',Number(m.dataset.i)===sortKey));
    });
  });
}
segInit($('#kindSeg'),'k',v=>{kind=v;arrange();});
segInit($('#sortSeg'),'s',v=>{sortKey=Number(v);arrange();});

/* ---------- 3. requirement tuner ---------- */
// 지원 무선, AI 처리 능력(0~3)
const RADIO={uno:[],stm32:[],pico:["wifi","ble"],nrf:["ble","thread"],esp32:["wifi","ble"],s3:["wifi","ble"],c3:["wifi","ble"],c6:["wifi","ble","thread"],h2:["ble","thread"],
  pi5:["wifi","ble"],zero:["wifi","ble"],jetson:["wifi","ble"],rk:["wifi","ble"],hailo:["wifi","ble"],bbb:[],latte:["wifi","ble"]};
const AI={uno:0,stm32:0,pico:0,nrf:0,esp32:0,s3:1,c3:0,c6:0,h2:0,pi5:1.5,zero:.5,jetson:3,rk:2.5,hailo:2.5,bbb:0,latte:1.5};
const KN=[
 {id:"os",l:"리눅스·도커",t:["불필요","필요"]},
 {id:"pw",l:"전원",t:["상시 전원","배터리 수주","배터리 수년"]},
 {id:"ai",l:"AI 연산",t:["없음","가벼움","보통","카메라 여러 대"]},
 {id:"rt",l:"실시간 제어",t:["필요 없음","보통","µs 정밀"]}
];
const RAD=[["none","무선 없음"],["wifi","Wi-Fi"],["ble","BLE"],["thread","Thread"]];
const PRE=[
 {n:"공장 Wi-Fi 센서",v:{os:0,pw:1,ai:0,rt:0,rd:"wifi"}},
 {n:"피트니스 밴드",v:{os:0,pw:2,ai:0,rt:0,rd:"ble"}},
 {n:"Matter 조명 스위치",v:{os:0,pw:1,ai:0,rt:0,rd:"thread"}},
 {n:"MCU 카메라 사람 감지",v:{os:0,pw:1,ai:1,rt:0,rd:"wifi"}},
 {n:"드론 비행 제어",v:{os:0,pw:0,ai:0,rt:2,rd:"none"}},
 {n:"MQTT 게이트웨이",v:{os:1,pw:0,ai:1,rt:0,rd:"wifi"}},
 {n:"자율주행 로봇 두뇌",v:{os:1,pw:0,ai:3,rt:0,rd:"wifi"}},
 {n:"배터리 + 무거운 AI?",v:{os:1,pw:2,ai:3,rt:2,rd:"wifi"}}
];
const req={os:0,pw:1,ai:0,rt:0,rd:"wifi"};
const knobs=$('#knobs'), rankEl=$('#rank'), presetsEl=$('#presets');
KN.forEach(k=>{
  const d=el('div','knob',`<div class="kl"><label for="k-${k.id}">${k.l}</label><span class="kv" id="kv-${k.id}"></span></div>
    <input type="range" id="k-${k.id}" min="0" max="${k.t.length-1}" step="1" value="${req[k.id]}">
    <div class="ticks">${k.t.map(t=>`<span>${t}</span>`).join('')}</div>`);
  d.querySelector('input').addEventListener('input',e=>{req[k.id]=Number(e.target.value);clearPreset();rank();});
  knobs.appendChild(d);
});
const rd=el('div','knob','<div class="kl"><span>무선</span></div>'); const rdb=el('div','radios');
RAD.forEach(([v,l])=>{const b=el('button','',l); b.dataset.v=v; b.onclick=()=>{req.rd=v;clearPreset();rank();}; rdb.appendChild(b);});
rd.appendChild(rdb); knobs.appendChild(rd);
PRE.forEach((p,i)=>{const b=el('button','preset',p.n); b.setAttribute('aria-pressed','false');
  b.onclick=()=>{Object.assign(req,p.v); KN.forEach(k=>$('#k-'+k.id).value=req[k.id]); clearPreset(); b.setAttribute('aria-pressed','true'); rank();};
  presetsEl.appendChild(b);});
function clearPreset(){presetsEl.querySelectorAll('.preset').forEach(b=>b.setAttribute('aria-pressed','false'));}
P.forEach(p=>{const r=el('div','rk '+p.k,`<span class="no"></span><span class="nm"><i></i><span>${p.n}</span></span><span class="fit"><span class="fbar"></span><span class="why"></span></span>`); r.dataset.id=p.id; rankEl.appendChild(r);});
function fit(p){
  const s=p.s, out=[]; let pen=0;
  if(req.os && p.k==="mcu"){pen+=6; out.push("리눅스 불가");}
  const needPw=[0,2.5,5][req.pw], dPw=Math.max(0,needPw-s[0]);
  if(dPw){pen+=dPw*1.4; out.push("전력 부족");}
  const needAi=[0,1,2.5,3][req.ai], ai=AI[p.id], dAi=Math.max(0,needAi-ai);
  if(dAi){pen+=dAi*2.2; out.push("AI 부족");} else if(ai>needAi) pen+=(ai-needAi)*.35;
  const needRt=[0,2.5,5][req.rt], dRt=Math.max(0,needRt-s[3]);
  if(dRt){pen+=dRt*1.4; out.push("실시간 약함");}
  if(req.rd!=="none" && !RADIO[p.id].includes(req.rd)){pen+=4; out.push(RAD.find(r=>r[0]===req.rd)[1]+" 없음");}
  const score=Math.max(0,Math.min(10,10-pen+s[4]*.1));
  return {score,why:out.length?"✕ "+out.join(" · "):"✓ 조건 충족"};
}
function rank(){
  KN.forEach(k=>$('#kv-'+k.id).textContent=k.t[req[k.id]]);
  rdb.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===req.rd)));
  const sc=P.map(p=>({p,...fit(p)})).sort((a,b)=>b.score-a.score);
  flip(rankEl,()=>{
    sc.forEach((x,i)=>{
      const r=rankEl.querySelector(`[data-id="${x.p.id}"]`);
      r.querySelector('.no').textContent=i+1;
      r.querySelector('.fbar').style.width=`calc(${(x.score/10.5*100).toFixed(1)}% * .55)`;
      r.querySelector('.why').textContent=x.why;
      r.classList.toggle('top',i<3 && x.score>=7); r.classList.toggle('low',x.score<5);
      rankEl.appendChild(r);
    });
  });
  const best=sc[0], v=$('#verdict');
  if(best.score>=7){ v.className='verdictBox'; v.innerHTML=`추천 <b>${best.p.n}</b> · ${best.p.t}`; }
  else { v.className='verdictBox hard'; v.innerHTML=`<b>한 부품으로는 무리</b> · SBC(판단)와 MCU(배터리·실시간)로 역할을 나눠 조합하세요`; }
}
rank();

/* ---------- 4. tree ---------- */
const T={
 start:{q:"리눅스 · 도커 · AI 추론이 필요한가?",o:[["예","sAI"],["아니오","mW"]]},
 mW:{q:"무선 통신이 필요한가?",o:[["예","mWhich"],["아니오","mMotor"]]},
 mMotor:{q:"모터를 정밀하게 제어하나?",o:[["예",["stm32"]],["아니오",["uno","pico"]]]},
 mWhich:{q:"어떤 무선?",o:[["Wi-Fi","mCam"],["BLE · 초저전력",["nrf"]],["Thread · Matter",["c6","h2","nrf"]]]},
 mCam:{q:"카메라나 AI를 MCU에서 돌리나?",o:[["예",["s3"]],["아니오",["c3","esp32"]]]},
 sAI:{q:"AI 부하가 큰가? (카메라 여러 대, 큰 모델)",o:[["예","sBudget"],["아니오","sSpecial"]]},
 sSpecial:{q:"특수한 요구가 있나?",o:[["없음","sSpace"],["µs 실시간 제어",["bbb"]],["Windows / x86 SW",["latte"]]]},
 sSpace:{q:"공간이나 전력 제약이 큰가?",o:[["예",["zero"]],["아니오",["pi5"]]]},
 sBudget:{q:"무엇이 더 중요한가?",o:[["최고 성능",["jetson"]],["가성비",["rk","hailo"]]]}
};
const treeEl=$('#tree'); let path=[]; // [{node,label}]
function renderTree(node,leaf){
  treeEl.innerHTML='';
  const trail=el('div','trail');
  if(!path.length) trail.innerHTML='<span class="crumb" style="cursor:default">시작</span>';
  path.forEach((st,i)=>{
    if(i) trail.appendChild(el('span','arrow','›'));
    const b=el('button','crumb',`${T[st.node].q.replace(/\?.*$/,'?')} <b>${st.label}</b>`);
    b.onclick=()=>{const n=path[i].node; path=path.slice(0,i); renderTree(n);};
    trail.appendChild(b);
  });
  treeEl.appendChild(trail);
  if(leaf){
    const box=el('div','qbox',`<div class="eyebrow">추천 부품</div>`);
    const r=el('div','result');
    leaf.forEach(id=>{const p=byId[id]; r.appendChild(el('div','res '+p.k,`<span class="kind ${p.k}" style="justify-self:start">${p.k.toUpperCase()}</span><div class="nm">${p.n}</div><div class="tag">${p.t}</div><div class="sp">${p.sp}</div>`));});
    box.appendChild(r);
    const again=el('button','btn ghostbtn','처음부터'); again.style.justifySelf='start';
    again.onclick=()=>{path=[];renderTree('start');};
    box.appendChild(again); treeEl.appendChild(box); return;
  }
  const n=T[node];
  const box=el('div','qbox',`<div class="eyebrow">질문 ${path.length+1}</div><div class="q">${n.q}</div>`);
  const opts=el('div','opts');
  n.o.forEach(([label,next])=>{
    const b=el('button','opt',label);
    b.onclick=()=>{path.push({node,label}); Array.isArray(next)?renderTree(null,next):renderTree(next);};
    opts.appendChild(b);
  });
  box.appendChild(opts); treeEl.appendChild(box);
}
renderTree('start');

})();
</script>
