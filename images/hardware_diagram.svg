<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200" width="2000" height="1200" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <style>
    .node { fill: #111827; stroke-width: 4; }
    .power-node { stroke: #f59e0b; }
    .compute-node { stroke: #22d3ee; }
    .drive-node { stroke: #a78bfa; }
    .safety-node { stroke: #f87171; }
    .title { fill: #f3f4f6; font-size: 30px; font-weight: 700; text-anchor: middle; }
    .sub { fill: #9ca3af; font-size: 19px; text-anchor: middle; font-family: 'JetBrains Mono', D2Coding, Menlo, monospace; }
    .power { stroke: #a8732a; stroke-width: 6; fill: none; stroke-linecap: round; }
    .data { stroke: #14b8a6; stroke-width: 4; fill: none; stroke-dasharray: 12 10; }
    .label { fill: #2dd4bf; font-size: 20px; font-family: 'JetBrains Mono', D2Coding, Menlo, monospace; }
    .label-sub { fill: #5eead4; font-size: 16px; opacity: 0.75; }
    .legend { fill: #9ca3af; font-size: 18px; }
  </style>

  <!-- 배경 -->
  <rect width="2000" height="1200" fill="#0b1018"/>
  <rect x="30" y="30" width="1940" height="1140" rx="18" fill="#0f141d" stroke="#1f2937" stroke-width="2"/>

  <!-- 제목 · 범례 -->
  <text x="70" y="92" fill="#e5e7eb" font-size="30" font-weight="700">TeachArm PoC 하드웨어 구조도</text>
  <line x1="70" y1="132" x2="120" y2="132" class="power"/>
  <text x="132" y="139" class="legend">전원</text>
  <line x1="200" y1="132" x2="250" y2="132" class="data"/>
  <text x="262" y="139" class="legend">데이터 · 통신</text>
  <rect x="70" y="160" width="18" height="18" rx="4" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="98" y="176" class="legend">전원부</text>
  <rect x="180" y="160" width="18" height="18" rx="4" fill="none" stroke="#22d3ee" stroke-width="3"/>
  <text x="208" y="176" class="legend">연산 · 센싱</text>
  <rect x="330" y="160" width="18" height="18" rx="4" fill="none" stroke="#a78bfa" stroke-width="3"/>
  <text x="358" y="176" class="legend">구동부</text>
  <rect x="440" y="160" width="18" height="18" rx="4" fill="none" stroke="#f87171" stroke-width="3"/>
  <text x="468" y="176" class="legend">안전</text>

  <!-- 전원선 -->
  <line x1="330" y1="530" x2="430" y2="300" class="power"/>
  <line x1="330" y1="565" x2="430" y2="565" class="power"/>
  <line x1="330" y1="600" x2="430" y2="995" class="power"/>
  <line x1="700" y1="285" x2="820" y2="280" class="power"/>
  <line x1="700" y1="565" x2="940" y2="565" class="power"/>
  <line x1="1190" y1="565" x2="1280" y2="565" class="power"/>
  <line x1="1610" y1="545" x2="1690" y2="545" class="power"/>
  <line x1="700" y1="1005" x2="1280" y2="1005" class="power"/>
  <line x1="1610" y1="985" x2="1690" y2="985" class="power"/>

  <!-- 데이터선 -->
  <line x1="1160" y1="235" x2="1280" y2="200" class="data"/>
  <line x1="1160" y1="315" x2="1280" y2="330" class="data"/>
  <text x="1220" y="282" class="label" text-anchor="middle">USB·UVC</text>

  <line x1="1140" y1="360" x2="1340" y2="500" class="data"/>
  <text x="1290" y="430" class="label">USB</text>

  <line x1="1065" y1="500" x2="1065" y2="360" class="data"/>
  <text x="1080" y="440" class="label">GPIO</text>

  <line x1="880" y1="360" x2="880" y2="760" class="data"/>
  <text x="862" y="440" class="label" text-anchor="end">Gigabit Ethernet</text>
  <text x="862" y="468" class="label label-sub" text-anchor="end">데이터셋 · 모델 · 로그</text>

  <line x1="1610" y1="590" x2="1690" y2="590" class="data"/>
  <text x="1650" y="668" class="label" text-anchor="middle">TTL 1Mbps</text>

  <line x1="1160" y1="870" x2="1310" y2="950" class="data"/>
  <text x="1240" y="880" class="label">USB</text>

  <line x1="1610" y1="1030" x2="1690" y2="1030" class="data"/>
  <text x="1650" y="1095" class="label" text-anchor="middle">TTL 1Mbps</text>

  <!-- 전원부 -->
  <rect x="70" y="500" width="260" height="130" rx="16" class="node power-node"/>
  <text x="200" y="560" class="title">AC 220V</text>
  <text x="200" y="595" class="sub">멀티탭 · 3계통 분기</text>

  <rect x="430" y="230" width="270" height="110" rx="16" class="node power-node"/>
  <text x="565" y="282" class="title">USB-C PD 5V/5A</text>
  <text x="565" y="316" class="sub">PSU-A · Pi 5</text>

  <rect x="430" y="510" width="270" height="110" rx="16" class="node power-node"/>
  <text x="565" y="562" class="title">어댑터 5V/4A</text>
  <text x="565" y="596" class="sub">PSU-B · 팔로워</text>

  <rect x="430" y="950" width="270" height="110" rx="16" class="node power-node"/>
  <text x="565" y="1002" class="title">어댑터 5V/4A</text>
  <text x="565" y="1036" class="sub">PSU-C · 리더</text>

  <!-- 연산 -->
  <rect x="820" y="200" width="340" height="160" rx="16" class="node compute-node"/>
  <text x="990" y="272" class="title">Raspberry Pi 5</text>
  <text x="990" y="308" class="sub">AI 추론 · 30Hz 제어</text>

  <rect x="820" y="760" width="340" height="150" rx="16" class="node compute-node"/>
  <text x="990" y="828" class="title">노트북 (GPU)</text>
  <text x="990" y="864" class="sub">학습 · 데이터 수집</text>

  <!-- 안전 -->
  <rect x="940" y="500" width="250" height="130" rx="16" class="node safety-node"/>
  <text x="1065" y="560" class="title">비상정지</text>
  <text x="1065" y="595" class="sub">NC 2접점 · DC 10A</text>

  <!-- 센싱 · 인터페이스 -->
  <rect x="1280" y="150" width="330" height="100" rx="16" class="node compute-node"/>
  <text x="1445" y="196" class="title">상단 카메라</text>
  <text x="1445" y="228" class="sub">640×480 · 30FPS</text>

  <rect x="1280" y="280" width="330" height="100" rx="16" class="node compute-node"/>
  <text x="1445" y="326" class="title">손목 카메라</text>
  <text x="1445" y="358" class="sub">640×480 · 30FPS</text>

  <rect x="1280" y="500" width="330" height="130" rx="16" class="node compute-node"/>
  <text x="1445" y="560" class="title">서보 버스 어댑터</text>
  <text x="1445" y="595" class="sub">팔로워 · USB→TTL</text>

  <rect x="1280" y="950" width="330" height="110" rx="16" class="node compute-node"/>
  <text x="1445" y="1002" class="title">서보 버스 어댑터</text>
  <text x="1445" y="1036" class="sub">리더 · USB→TTL</text>

  <!-- 구동부 -->
  <rect x="1690" y="500" width="250" height="130" rx="16" class="node drive-node"/>
  <text x="1815" y="560" class="title">STS3215 ×6</text>
  <text x="1815" y="595" class="sub">팔로워 팔 · 7.4V</text>

  <rect x="1690" y="950" width="250" height="110" rx="16" class="node drive-node"/>
  <text x="1815" y="1002" class="title">STS3215 ×6</text>
  <text x="1815" y="1036" class="sub">리더 팔 · 교시용</text>

  <!-- GND -->
  <text x="1000" y="1128" fill="#9ca3af" font-size="20" text-anchor="middle" font-family="'JetBrains Mono', D2Coding, Menlo, monospace">모든 GND 공통 연결 (서보 전원 GND ↔ USB GND, 버스 어댑터 경유)</text>
  <line x1="110" y1="1148" x2="1890" y2="1148" stroke="#6b7280" stroke-width="3" stroke-dasharray="16 12"/>
</svg>
